const petaH=()=>`<div class=tj><h3>Tujuanku</h3><ul class=tl><li>Menentukan persamaan lingkaran</li><li>Menganalisis kedudukan titik</li><li>Menganalisis kedudukan garis</li></ul><img src="${IMG.peta.u}" alt="${IMG.peta.a}"></div><div class=pc>${PK.map(p=>`<div class=pk><i>${p[0]}</i><b>${p[1]}</b><span>${p[2]}</span><button class="b g" data-i=${p[3]}>Mulai ›</button></div>`).join('')}</div>`;
const rubH=()=>`<div class=rub><div class=rt>Rubrik skor tiap soal (0–4)</div>${[[4,'Tepat dan lengkap','ra'],[3,'Benar, sedikit salah hitung','rb'],[2,'Rumus benar, langkah kurang',''],[1,'Baru menulis rumus',''],[0,'Belum menjawab','re']].map(r=>`<div class="rc ${r[2]}"><b>${r[0]}</b>${r[1]}</div>`).join('')}</div>`;
function boom(){const e=document.createElement('div');e.textContent='🎉✨⭕';e.style.cssText='position:absolute;left:35%;top:45%;font-size:6cqw;animation:up 1s forwards;z-index:8';st.append(e);setTimeout(()=>e.remove(),1000)}
function go(m){n=Math.max(0,Math.min(S.length-1,m));const s=S[n],T=s[3];st.className=s[7]?'dk':'';$('#nt').style.display='none';
k=((T&&T!='tri'&&T!='cover'&&T!='peta')||s[4])?s[1].length:(s[1].length?1:0);
let h='';
if(T=='cover')h=`<div class=cv><div class=ck>MATEMATIKA · KELAS XII</div><h1>Lingkaran Budaya Sultra</h1><p class=cs>Persamaan Lingkaran serta Kedudukan Titik dan Garis terhadap Lingkaran</p><div class=cg>Muh. Sigit Aidit Sugiarto<br>A3S226027</div><button class="b g" id=mulai>Ayo Mulai ›</button></div><div class=cr>${ICO.cover}</div>`;
else{h=`<div class=pill>${s[8]}</div>${n>2?'<button class=back>← Peta Materi</button>':''}<h2>${s[0]}</h2>`;
if(T=='peta')h+=petaH();else h+=`<ul class="${T=='tri'?'tri':''}" style="${s[1].join('').length>330?'font-size:1.85cqw':''}">${s[1].map(ri).join('')}</ul>`;
const g=s[2];if(g&&g.slice(0,4)=='img:'){const q=IMG[g.slice(4)];h+=`<div class=tag style="${q.s}"><img src="${q.u}" alt="${q.a}" style="width:100%;height:100%;object-fit:cover;display:block"></div>`}
else if(g&&g.slice(0,3)=='ic:')h+=`<div class=ic>${g.slice(3).split('+').map(x=>ICO[x]).join('')}</div>`;else if(g)h+=`<div class=em>${g}</div>`;
if(T=='rub')h+=rubH();
if(s[4]||(T&&!['tri','rub','peta','cover'].includes(T))){h+=`<div class="w${T?'':' solo'}">`+(s[4]?`<div class=lk>${L[s[4]]?`<a class="b g" target=_blank rel=noopener href="${L[s[4]]}">${s[5]||'Buka'} ›</a>`:'<span class="b off">Tautan belum diisi</span>'}${L[s[4]]?'<div class=qw><div class=qr>[kode QR]</div>Pindai dengan ponsel</div>':''}</div>`:'')+'</div>'}}
$('#v').innerHTML=h;
document.querySelectorAll('.rv').forEach(b=>b.onclick=()=>{b.nextElementSibling.classList.add('on');b.remove()});
const bk=$('.back');if(bk)bk.onclick=()=>go(2);const ml=$('#mulai');if(ml)ml.onclick=()=>go(1);
document.querySelectorAll('.pk .b').forEach(b=>b.onclick=()=>go(+b.dataset.i));
if(T&&!['tri','rub','peta','cover'].includes(T))wid(T);
const qe=document.querySelector('.qr');if(qe&&s[4]&&L[s[4]]&&QRS[s[4]]&&QRS[s[4]].u==L[s[4]]){qe.textContent='';qe.title='Klik untuk memperbesar';qe.innerHTML='<img src="'+QRS[s[4]].s+'" alt="Kode QR" style="width:100%;height:100%;display:block">';qe.onclick=()=>qe.classList.toggle('zoom')}else if(qe&&s[4]&&L[s[4]]&&typeof QRCode!='undefined'){qe.textContent='';qe.title='Klik untuk memperbesar';new QRCode(qe,{text:L[s[4]],width:256,height:256,correctLevel:QRCode.CorrectLevel.M});qe.querySelectorAll('img').forEach(e=>{e.style.width='100%';e.style.height='100%';e.style.display='block'});qe.onclick=()=>qe.classList.toggle('zoom')}
sh2()}
function sh2(){document.querySelectorAll('#v>ul>li').forEach((e,i)=>e.classList.toggle('on',i<k));$('#ct').textContent=`Slide ${n+1} / ${S.length}`;$('#pg').style.width=(n+1)/S.length*100+'%'}
function nx(){if(k<S[n][1].length){k++;sh2()}else go(n+1)}
$('#nx').onclick=nx;$('#pv').onclick=()=>go(n-1);
$('#pm').onclick=()=>$('#mp').style.display='grid';$('#cl').onclick=()=>$('#mp').style.display='none';
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{$('#mp').style.display='none';go(+b.dataset.g)});
$('#cn').onclick=()=>{const e=$('#nt');e.textContent=S[n][6]||'';e.style.display=e.style.display=='block'?'none':'block'};
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key==' ')nx();if(e.key=='ArrowLeft')go(n-1)});
go(0);
</script></body></html>
